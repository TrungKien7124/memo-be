x-common-env: &common-env
  env_file:
    - .env.docker

services:
  # ──────────────── PostgreSQL ────────────────
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-memo_db}
      POSTGRES_USER: ${POSTGRES_USER:-memo_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-memo_password}
    ports:
      - "${DB_PORT_EXPOSE:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-memo_user} -d ${POSTGRES_DB:-memo_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ──────────────── Redis ────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT_EXPOSE:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ──────────────── Django Web ────────────────
  web:
    build:
      context: .
      dockerfile: Dockerfile
    <<: *common-env
    command: >
      gunicorn memo_backend.wsgi:application
      --bind 0.0.0.0:8000
      --workers 3
      --timeout 120
      --chdir /app/be
    ports:
      - "${WEB_PORT:-8000}:8000"
    volumes:
      - static_files:/app/be/staticfiles
      - rag_data:/app/data/chroma
    environment:
      RUN_MIGRATIONS: "true"
      COLLECT_STATIC: "true"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ──────────────── Celery Worker ────────────────
  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    <<: *common-env
    command: celery -A memo_backend worker -l info --concurrency=2
    working_dir: /app/be
    volumes:
      - rag_data:/app/data/chroma
    environment:
      RUN_MIGRATIONS: "false"
      COLLECT_STATIC: "false"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ──────────────── Celery Beat (scheduler) ────────────────
  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile
    <<: *common-env
    command: celery -A memo_backend beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    working_dir: /app/be
    environment:
      RUN_MIGRATIONS: "false"
      COLLECT_STATIC: "false"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ──────────────── Daphne (WebSocket / ASGI) ────────────────
  daphne:
    build:
      context: .
      dockerfile: Dockerfile
    <<: *common-env
    command: daphne -b 0.0.0.0 -p 8001 memo_backend.asgi:application
    working_dir: /app/be
    volumes:
      - rag_data:/app/data/chroma
    ports:
      - "${WS_PORT:-8001}:8001"
    environment:
      RUN_MIGRATIONS: "false"
      COLLECT_STATIC: "false"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  static_files:
    driver: local
  rag_data:
    driver: local
